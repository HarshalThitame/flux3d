name: Sync Meta Catalog
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call full catalog sync endpoint
        run: |
          curl -sS --retry 3 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://${{ vars.VERCEL_URL || 'flux3d.vercel.app' }}/api/cron/sync-meta-catalog"
