name: Sync WhatsApp Knowledge
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -sS --retry 2 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://${{ vars.VERCEL_URL || 'flux3d.vercel.app' }}/api/cron/sync-whatsapp-knowledge"
