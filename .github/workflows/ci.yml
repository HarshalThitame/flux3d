name: CI

on:
  push:
    branches: [main, develop, 'agent/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npx size-limit

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  secret-leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: |
          if git log --all --oneline -- docs/secret.md | grep -q .; then
            echo "::error::docs/secret.md exists in git history. Run git filter-repo to purge it."
            exit 1
          fi
          if find . -name '.env.local' -not -path './node_modules/*' | grep -q .; then
            echo "::error::Found .env.local in the repository tree."
            exit 1
          fi
          if grep -rn "Bearer aded32727\|Bearer 30f52afd" supabase/ --include="*.sql" 2>/dev/null | grep -q .; then
            echo "::error::Hardcoded webhook secret found in a SQL migration."
            exit 1
          fi
          echo "No committed secrets detected."
